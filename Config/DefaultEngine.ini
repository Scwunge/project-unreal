[/Script/Engine.RendererSettings]
; Minecraft's look: blocks are unlit (the mesher bakes Minecraft's own shading and light into vertex colours),
; drawn without exposure adaptation, bloom, motion blur or temporal smearing of the pixel-art textures.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.Bloom=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.AntiAliasingMethod=0
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
; Custom depth with stencil: a boat's hull mask (stencil 77) keeps water out of the hull.
r.CustomDepth=3

