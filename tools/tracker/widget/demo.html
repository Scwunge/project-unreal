<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker embed demo</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1d2129; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --fg: #e6e8ec; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 800px; margin: 0 auto; }
  iframe { width: 100%; border: 0; display: block; min-height: 300px; }
  h1 { font-size: 20px; } h2 { font-size: 15px; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>Tracker embed demo</h1>
  <p>Both embed methods, reading <code>../progress.json</code>. Serve the <code>tools/tracker</code> folder over HTTP to view it
  (browsers block <code>fetch</code> from <code>file://</code> pages).</p>

  <h2>1. Script tag and div</h2>
  <div data-mc-tracker data-src="../progress.json" data-interval="60"></div>
  <script src="tracker.js" defer></script>

  <h2>2. Iframe (dark theme forced)</h2>
  <iframe id="mc-tracker-frame" src="index.html?src=../progress.json&amp;theme=dark" title="Port progress" loading="lazy"></iframe>
  <script>
    window.addEventListener("message", function (e) {
      if (e.data && e.data.type === "mc-tracker-height") {
        document.getElementById("mc-tracker-frame").style.height = e.data.height + "px";
      }
    });
  </script>
</main>
</body>
</html>
